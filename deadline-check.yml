name: Deadline Email Check

on:
  schedule:
    # Runs daily at 03:00 UTC (~08:45 AM Nepal time). Adjust as you like.
    - cron: '0 3 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run deadline check
        env:
          # --- put your real address here directly (not sensitive) ---
          EMAIL_TO: "your-email@example.com"
          EMAIL_FROM: "your-email@example.com"

          # --- SMTP login: these MUST stay as GitHub Secrets, never plain text ---
          # Settings → Secrets and variables → Actions → New repository secret
          SMTP_HOST: "smtp.gmail.com"
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

          # Optional: pin to a fiscal year, e.g. 2026 for BS 083/084.
          # Leave commented to auto-detect from today's date.
          # FY_START_YEAR: "2026"

          DAYS_AHEAD: "5"
        run: python3 scripts/check_deadlines.py
